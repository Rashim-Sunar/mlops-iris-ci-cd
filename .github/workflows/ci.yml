name: ML Continuous Integration

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Code quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Compile Python source
        run: python -m compileall -q src tests
      - name: Run Ruff checks
        run: ruff check .
      - name: Check Ruff formatting
        run: ruff format --check .

  tests:
    name: Automated tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run automated tests
        run: pytest -v --tb=short

  ml-quality-gate:
    name: ML quality gate
    needs: [quality, tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install development dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Run ML quality gate
        run: python -m src.quality_gate data/raw/Iris.csv --report reports/quality_report.json --artifacts-dir artifacts
      - name: Upload validated model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: validated-model-${{ github.run_id }}
          path: artifacts/
          retention-days: 7
      - name: Upload ML quality report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ml-quality-report-${{ github.run_id }}
          path: reports/quality_report.json
          if-no-files-found: ignore

  build-and-push:
    name: Build, smoke-test, and publish image
    needs: [quality, tests, ml-quality-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out workflow commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Download validated model artifacts
        uses: actions/download-artifact@v4
        with:
          name: validated-model-${{ github.run_id }}
          path: artifacts
      - name: Download quality report
        uses: actions/download-artifact@v4
        with:
          name: ml-quality-report-${{ github.run_id }}
          path: reports
      - name: Verify release inputs and provenance
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          model = Path("artifacts/iris_model.joblib")
          metadata_path = Path("artifacts/model_metadata.json")
          report_path = Path("reports/quality_report.json")
          for path in (model, metadata_path, report_path):
              if not path.is_file() or path.stat().st_size == 0:
                  raise SystemExit(f"Missing release input: {path}")
          metadata = json.loads(metadata_path.read_text())
          report = json.loads(report_path.read_text())
          if report.get("overall_result") != "PASS":
              raise SystemExit("Quality report does not indicate PASS")
          if metadata.get("overall_result") != "PASS":
              raise SystemExit("Model metadata does not indicate PASS")
          if metadata.get("source_commit_sha") != "${{ github.sha }}":
              raise SystemExit("Model metadata commit does not match workflow commit")
          if metadata.get("dataset", {}).get("filename") != "data/raw/Iris.csv":
              raise SystemExit("Model metadata dataset does not match repository dataset")
          PY
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build image for smoke testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          push: false
          tags: iris-mlops:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Run container smoke tests
        run: python scripts/smoke_test.py iris-mlops:${{ github.sha }}
      - name: Log in to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Tag and publish immutable image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          docker tag iris-mlops:${{ github.sha }} "$DOCKERHUB_USERNAME/iris-mlops:sha-${{ github.sha }}"
          docker tag iris-mlops:${{ github.sha }} "$DOCKERHUB_USERNAME/iris-mlops:latest"
          docker push "$DOCKERHUB_USERNAME/iris-mlops:sha-${{ github.sha }}"
          docker push "$DOCKERHUB_USERNAME/iris-mlops:latest"
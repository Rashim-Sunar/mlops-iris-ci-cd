name: Continuous Delivery to Render

on:
  workflow_run:
    workflows: ["ML Continuous Integration"]
    types: [completed]
    branches: [main]

permissions: {}

concurrency:
  group: render-production
  cancel-in-progress: false

jobs:
  deliver-to-render:
    name: Deliver release to Render
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render delivery after approval
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          test -n "$RENDER_DEPLOY_HOOK_URL"
          curl --fail --silent --show-error \
            --request POST \
            --max-time 30 \
            "$RENDER_DEPLOY_HOOK_URL"